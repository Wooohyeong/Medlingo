<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MedDaily</title>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a;background:#f8fafc}
      body{margin:0}#app{max-width:960px;margin:0 auto;padding:16px}button,input,select{font-size:16px}
      .card{background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
      .btn{border:none;border-radius:10px;padding:12px;font-weight:600;background:#0f766e;color:white}
      .btn.secondary{background:#334155}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#64748b}
      .good{color:#059669}.bad{color:#dc2626} table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left}
      @media(min-width:768px){#app{padding:24px}}
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
